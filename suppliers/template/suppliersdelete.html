{% extends "home/base.html" %}

{% block content %}
    <style>
        .supplier-delete-card { max-width: 500px; background: #fff; margin: 0 auto; padding: 30px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        .supplier-delete-card h1 { color: #b02a37; margin-top: 0; }
        .delete-confirm, .delete-cancel { display: inline-block; padding: 10px 16px; border: 0; border-radius: 6px; text-decoration: none; cursor: pointer; font-weight: 600; }
        .delete-confirm { background: #dc3545; color: #fff; } .delete-cancel { background: #e9ecef; color: #495057; margin-left: 8px; }
    </style>
    <div class="supplier-delete-card">
    <h1>Delete Supplier</h1>
    <p>Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <button class="delete-confirm" type="submit">Yes, Delete</button>
        <a class="delete-cancel" href="{% url 'suppliers:supplier-list' %}">Cancel</a>
    </form>
    </div>
{% endblock %}
