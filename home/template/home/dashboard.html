{% extends 'home/base.html' %}

{% block content %}
<style>
    .dashboard-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
        gap: 12px;
        flex-wrap: wrap;
    }

    .dashboard-title {
        font-size: 1.7rem;
        font-weight: 700;
        color: #111827;
        margin-bottom: 6px;
    }

    .dashboard-subtitle {
        color: #6b7280;
        margin-bottom: 0;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
    }

    .stat-card {
        background: linear-gradient(135deg, #ffffff, #f8fafc);
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 20px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .stat-label {
        font-size: 0.92rem;
        color: #64748b;
        margin-bottom: 6px;
    }

    .stat-value {
        font-size: 1.4rem;
        font-weight: 700;
        color: #111827;
    }
</style>

<div class="dashboard-header">
    <div>
        <h2 class="dashboard-title">Welcome Back</h2>
        <p class="dashboard-subtitle">Your business dashboard is ready to help you manage operations smoothly.</p>
    </div>
</div>

<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-label">Total Orders</div>
        <div class="stat-value">124</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Active Users</div>
        <div class="stat-value">18</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Products In Stock</div>
        <div class="stat-value">86</div>
    </div>
    <div class="stat-card">
        <div class="stat-label">Suppliers</div>
        <div class="stat-value">12</div>
    </div>
</div>
{% endblock %}
