{% extends "home/base.html" %} {% block content %}
<style>
  .card {
    background: #fff;
    padding: 28px;
    border-radius: 12px;
    box-shadow: 0 2px 12px #00000014;
  }
  .head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 22px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  th {
    background: #343a40;
    color: #fff;
    text-align: left;
    padding: 12px;
  }
  td {
    padding: 12px;
    border-bottom: 1px solid #e9ecef;
  }
  tr:hover {
    background: #f8f9fa;
  }
  .btn {
    display: inline-block;
    padding: 8px 12px;
    border-radius: 6px;
    text-decoration: none;
    background: #0d6efd;
    color: #fff;
  }
  .edit {
    color: #0d6efd;
  }
  .delete {
    color: #b02a37;
    margin-left: 10px;
  }
  @media (max-width: 700px) {
    table {
      display: block;
      overflow: auto;
      white-space: nowrap;
    }
  }
</style>
<div class="card">
  <div class="head">
    <h1>Categories</h1>
    <a class="btn" href="{% url 'product:category-create' %}">Add Category</a>
  </div>
  <table>
    <thead>
      <tr>
        <th>Name</th>
        <th>Description</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for category in categories %}
      <tr>
        <td>{{ category.category_name }}</td>
        <td>{{ category.description|default:"—" }}</td>
        <td>
          <a class="edit" href="{% url 'product:category-update' category.pk %}"
            >Edit</a
          ><a
            class="delete"
            href="{% url 'product:category-delete' category.pk %}"
            >Delete</a
          >
        </td>
      </tr>
      {% empty %}
      <tr>
        <td colspan="3">No categories found.</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
