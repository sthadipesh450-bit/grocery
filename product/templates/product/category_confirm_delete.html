{% extends "home/base.html" %} {% block content %}
<div
  style="
    max-width: 500px;
    margin: auto;
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 2px 12px #00000014;
  "
>
  <h1>Delete Category</h1>
  <p>Delete <strong>{{ object.category_name }}</strong>?</p>
  <form method="post">
    {% csrf_token %}<button
      style="
        background: #dc3545;
        color: white;
        border: 0;
        padding: 10px 16px;
        border-radius: 6px;
      "
    >
      Delete
    </button>
    <a href="{% url 'product:category-list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
