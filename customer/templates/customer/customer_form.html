{% extends "home/base.html" %} {% block content %}<style>
  .form-card {
    max-width: 650px;
    margin: auto;
    background: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 2px 12px #00000014;
  }
  .form-card p {
    margin-bottom: 15px;
  }
  .form-card label {
    display: block;
    font-weight: 600;
    margin-bottom: 5px;
  }
  .form-card input,
  .form-card textarea {
    width: 100%;
    padding: 10px;
    border: 1px solid #ced4da;
    border-radius: 6px;
  }
  .save,
  .cancel {
    padding: 10px 16px;
    border: 0;
    border-radius: 6px;
    text-decoration: none;
    cursor: pointer;
  }
  .save {
    background: #0d6efd;
    color: #fff;
  }
  .cancel {
    background: #e9ecef;
    color: #333;
    margin-left: 8px;
  }
</style>
<div class="form-card">
  <h1>{% if object %}Update{% else %}Add{% endif %} Customer</h1>
  <form method="post">
    {% csrf_token %}{{ form.as_p }}<button class="save" type="submit">
      Save</button
    ><a class="cancel" href="{% url 'customer:customer-list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
